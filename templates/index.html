<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GL Bajaj Campus Clubs</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">🎪 GL BAJAJ CAMPUS CLUBS</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/core-team-portal?passcode=GLB-Core2026-Navrang#Sec" style="color: var(--accent-gold);">🔒 Core Portal</a>
        </div>
    </div>

    <div class="hero-banner">
        <h1>✨ Select a Club to Explore ✨</h1>
        <p>Click on any club card below to view its complete details, avenues, and events</p>
    </div>

    <div class="container">
        <div class="section-grid">
            {% for club in clubs %}
            <div class="club-card" style="text-align: center; cursor: pointer;" onclick="window.location.href='/club/{{ club.id }}'">
                <span class="club-type-tag" style="display: inline-block; margin-bottom: 10px;">{{ club.type }}</span>
                <h2 style="color: var(--primary-maroon);">{{ club.name }}</h2>
                <p style="color: #666;">{{ club.department }}</p>
                <button style="margin-top: 15px; background: var(--primary-maroon); color: var(--accent-gold); border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;">View Club Portal →</button>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
